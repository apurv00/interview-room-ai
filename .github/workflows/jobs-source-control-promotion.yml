name: Jobs Data-Lifecycle Promotion Gate

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Prepare source indexes, or run the combined source-control and retention gate
        required: true
        default: verify-promotion
        type: choice
        options:
          - prepare-indexes
          - verify-promotion

permissions:
  contents: read

concurrency:
  group: jobs-source-control-jobs-staging
  cancel-in-progress: false

jobs:
  verify-a02:
    name: Jobs ${{ inputs.phase }} on jobs-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deliberately hard-coded: the smoke creates and drops UUID-named
    # collections and must never be pointed at a selectable production env.
    environment: jobs-staging
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This is intentionally the first database step. It is read-only and
      # rejects a production URI even if it was stored under the staging secret.
      - name: Verify dedicated staging database identity
        run: npx tsx scripts/verify-jobs-staging-database.ts
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          A02_STAGING_EXPECTED_DATABASE: ${{ vars.A02_STAGING_EXPECTED_DATABASE }}
          A02_STAGING_SENTINEL_TOKEN: ${{ secrets.A02_STAGING_SENTINEL_TOKEN }}

      - name: Prepare five non-dropping source-control indexes
        run: npm run prepare:jobs-source-control-indexes -- --apply
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Preview historical retention repair
        if: inputs.phase == 'verify-promotion'
        run: npm run repair:jobs-retention
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Clear historical TTLs and repair owner pins
        if: inputs.phase == 'verify-promotion'
        run: npm run repair:jobs-retention -- --apply
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Verify owner-retention repair state
        if: inputs.phase == 'verify-promotion'
        run: npm run check:jobs-retention
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Preview retention TTL index activation
        if: inputs.phase == 'verify-promotion'
        run: npm run prepare:jobs-retention-index
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Activate exact retention TTL index
        if: inputs.phase == 'verify-promotion'
        run: npm run prepare:jobs-retention-index -- --apply
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Verify exact retention TTL index
        if: inputs.phase == 'verify-promotion'
        run: npm run check:jobs-retention-index
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Verify durable source lineage
        if: inputs.phase == 'verify-promotion'
        run: npm run check:jobs-source-lineage
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Verify source-control invariants
        if: inputs.phase == 'verify-promotion'
        run: npm run check:jobs-source-control
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Exercise both races and production-shaped retained-corpus bound
        if: inputs.phase == 'verify-promotion'
        run: npm run smoke:jobs-source-control
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          A02_SMOKE_ALLOW: '1'
          A02_SMOKE_ROWS: '25000'
          A02_SMOKE_MAX_MS: '45000'

      # Run lifecycle mutations only after the exact retained-corpus/source
      # checks. TTL deletion is asynchronous and intentionally leaves the
      # serialized admission counter stale-high until its next preflight.
      - name: Preview Jobs retention lifecycle
        if: inputs.phase == 'verify-promotion'
        run: npm run sweep:jobs-retention
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Apply Jobs retention lifecycle
        if: inputs.phase == 'verify-promotion'
        run: npm run sweep:jobs-retention -- --apply
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Verify Jobs retention lifecycle convergence
        if: inputs.phase == 'verify-promotion'
        run: npm run check:jobs-retention-sweep
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
