name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_commit:
        description: Exact 40-character commit on main to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.2.6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Validate manual CI request
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          if ! printf '%s' "$TARGET_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'target_commit must be an exact lowercase 40-character SHA' >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != 'main' ]; then
            echo 'Manual CI must be dispatched from main' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_commit || github.sha }}

      - name: Verify checked-out manual target is on main
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_COMMIT" origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Module size budget
        run: node scripts/check-module-size.mjs

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:run

      - name: Candidate scale on MongoDB 8.2.6
        run: npm run test:hire-candidate-scale-mongo
        env:
          HIRE_CANDIDATE_SCALE_MONGO_TEST_URI: mongodb://localhost:27017/ipg_candidate_scale_ci_test

      - name: Apply and check candidate-workspace indexes
        run: |
          npm run prepare:hire-candidate-workspace-indexes -- --apply
          npm run check:hire-candidate-workspace-indexes
        env:
          IPG_SURFACE: hire-control
          MONGODB_URI: mongodb://localhost:27017/ipg_candidate_indexes_ci_test
          HIRE_CONTROL_DATABASE_NAME: ipg_candidate_indexes_ci_test
          HIRE_RUNTIME_DATABASE_NAME: ipg_candidate_runtime_ci_test
          B2C_DATABASE_NAME: ipg_candidate_b2c_ci_test

      - name: Build B2C surface
        run: npm run build
        env:
          IPG_SURFACE: b2c
          NEXT_PUBLIC_FEATURE_MULTIMODAL: 'false'
          NEXTAUTH_SECRET: ci-placeholder
          MONGODB_URI: mongodb://localhost:27017/ci
          REDIS_URL: redis://localhost:6379
          ANTHROPIC_API_KEY: sk-ant-placeholder

      - name: Build Hire control surface
        run: npm run build
        env:
          IPG_SURFACE: hire-control
          NEXT_PUBLIC_FEATURE_MULTIMODAL: 'false'
          NEXTAUTH_SECRET: ci-placeholder
          MONGODB_URI: mongodb://localhost:27017/hire_control_ci
          HIRE_CONTROL_DATABASE_NAME: hire_control_ci
          REDIS_URL: redis://localhost:6379
          ANTHROPIC_API_KEY: sk-ant-placeholder

      - name: Build and verify Hire engine surface
        run: |
          npm run build
          npm run check:hire-browser-build
        env:
          IPG_SURFACE: hire-engine
          NEXT_PUBLIC_FEATURE_MULTIMODAL: 'true'
          NEXTAUTH_SECRET: ci-placeholder
          MONGODB_URI: mongodb://localhost:27017/hire_engine_ci
          HIRE_RUNTIME_DATABASE_NAME: hire_engine_ci
          REDIS_URL: redis://localhost:6379
          ANTHROPIC_API_KEY: sk-ant-placeholder
